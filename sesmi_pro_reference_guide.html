                            <p className="text-slate-700">A: Bill of Quantities (defines the amounts and prices).</p>

                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm delay-200 animate-fade-in-up">
                            <h4 className="font-bold text-purple-600 mb-1">Q: Remeasured vs Lump Sum?</h4>
                            <p className="text-slate-700">A: Remeasured pays based on actual measured quantities on site. Lump sum pays a fixed agreed amount.</p>
                        </div>

                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm delay-300 animate-fade-in-up">
                            <h4 className="font-bold text-emerald-600 mb-1">Q: What is Retention vs Down Payment?</h4>
                            <p className="text-slate-700">A: Retention is money temporarily withheld as a guarantee. Down Payment is an advance payment given to start the work.</p>
                        </div>

                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm delay-[400ms] animate-fade-in-up">
                            <h4 className="font-bold text-orange-600 mb-1">Q: Why do we need PPC?</h4>
                            <p className="text-slate-700">A: To officially calculate and approve payment for actual executed work.</p>
                        </div>
                    </div>
                ),
                speakerNotes: "Keep these answers in mind if the manager asks questions during the presentation. Keep your answers short and simple."
            }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState(appData[0].id);
            const [sidebarOpen, setSidebarOpen] = useState(true);

            // Re-trigger animation on tab change by providing a unique key
            const activeSlide = appData.find(slide => slide.id === activeTab);

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50">
                    
                    {/* Sidebar */}
                    <div className={`${sidebarOpen ? 'w-72' : 'w-0 -translate-x-full'} transition-all duration-300 ease-in-out bg-slate-900 text-white flex flex-col fixed md:relative z-20 h-full shadow-2xl overflow-y-auto overflow-x-hidden`}>
                        <div className="p-6">
                            <h1 className="text-2xl font-bold text-white flex items-center gap-3 w-64">
                                <i className="fa-solid fa-layer-group text-blue-400"></i>
                                SESMI Pro
                            </h1>
                            <p className="text-slate-400 text-sm mt-2 w-64">Presentation & Reference App</p>
                        </div>
                        
                        <nav className="flex-1 px-4 pb-6 space-y-2 mt-4 w-72">
                            {appData.map((item) => (
                                <button
                                    key={item.id}
                                    onClick={() => {
                                        setActiveTab(item.id);
                                        if(window.innerWidth < 768) setSidebarOpen(false);
                                    }}
                                    className={`w-[250px] flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-left
                                        ${activeTab === item.id 
                                            ? 'bg-blue-600 text-white shadow-md font-medium' 
                                            : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                                        }`}
                                >
                                    <i className={`${item.icon} w-5 text-center`}></i>
                                    {item.title}
                                </button>
                            ))}
                        </nav>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        {/* Header */}
                        <header className="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 shadow-sm z-10">
                            <div className="flex items-center gap-4">
                                <button 
                                    onClick={() => setSidebarOpen(!sidebarOpen)}
                                    className="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition"
                                >
                                    <i className="fa-solid fa-bars text-xl"></i>
                                </button>
                                <h2 className="text-xl font-bold text-slate-800">
                                    {activeSlide.title}
                                </h2>
                            </div>
                            <div className="flex items-center gap-2 text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">
                                <i className="fa-solid fa-globe text-blue-500"></i> Simple English
                            </div>
                        </header>

                        {/* Slide Content */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8 relative w-full pb-32">
                            <div className="max-w-5xl mx-auto w-full" key={activeTab}>
                                {activeSlide.content}
                            </div>
                        </main>

                        {/* Speaker Notes (Bottom Bar) */}
                        {activeSlide.speakerNotes && (
                            <div key={`notes-${activeTab}`} className="absolute bottom-0 left-0 right-0 glass-note p-4 md:p-6 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] animate-fade-in z-10">
                                <div className="max-w-5xl mx-auto flex gap-4">
                                    <div className="text-blue-500 text-2xl shrink-0 mt-1">
                                        <i className="fa-solid fa-comment-dots"></i>
                                    </div>
                                    <div>
                                        <h4 className="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1">What to say to the team:</h4>
                                        <p className="text-slate-800 text-sm md:text-base font-medium leading-relaxed">
                                            "{activeSlide.speakerNotes}"
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Mobile overlay */}
                    {sidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-slate-900/50 z-10 md:hidden"
                            onClick={() => setSidebarOpen(false)}
                        ></div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
